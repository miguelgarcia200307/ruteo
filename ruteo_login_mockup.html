
<div style="display: flex; justify-content: center; padding: 2rem 0; background: var(--color-background-secondary); border-radius: var(--border-radius-lg);">

  <!-- Phone frame -->
  <div style="width: 320px; background: #0f172a; border-radius: 44px; padding: 10px; box-shadow: 0 0 0 1px #1e293b;">
    
    <!-- Screen -->
    <div style="background: #F8FAFC; border-radius: 36px; overflow: hidden; min-height: 660px; position: relative;">

      <!-- Status bar -->
      <div style="background: #F8FAFC; display: flex; justify-content: space-between; align-items: center; padding: 14px 24px 6px; font-size: 11px; font-weight: 500; color: #334155;">
        <span>9:41</span>
        <div style="display: flex; gap: 5px; align-items: center;">
          <svg width="15" height="10" viewBox="0 0 15 10"><rect x="0" y="3" width="3" height="7" rx="1" fill="#334155"/><rect x="4" y="2" width="3" height="8" rx="1" fill="#334155"/><rect x="8" y="0" width="3" height="10" rx="1" fill="#334155"/><rect x="12" y="0" width="3" height="10" rx="1" fill="#E2E8F0"/></svg>
          <svg width="16" height="10" viewBox="0 0 16 10"><path d="M8 1.5C10.5 1.5 12.7 2.6 14.2 4.3L15.5 3C13.7 1.1 11.2 0 8.5 0 5.8 0 3.3 1.1 1.5 3L2.8 4.3C4.3 2.6 6.3 1.5 8 1.5Z" fill="#334155"/><path d="M8 4C9.8 4 11.4 4.8 12.5 6L13.8 4.7C12.4 3.3 10.5 2.5 8.5 2.5 6.5 2.5 4.6 3.3 3.2 4.7L4.5 6C5.6 4.8 7.2 4 8 4Z" fill="#334155"/><circle cx="8" cy="8" r="1.5" fill="#334155"/></svg>
          <svg width="24" height="11" viewBox="0 0 24 11"><rect x="0" y="1" width="20" height="9" rx="2" stroke="#334155" stroke-width="1" fill="none"/><rect x="1.5" y="2.5" width="13" height="6" rx="1" fill="#334155"/><rect x="21" y="3.5" width="2" height="4" rx="1" fill="#334155"/></svg>
        </div>
      </div>

      <!-- Content -->
      <div style="padding: 28px 28px 32px; display: flex; flex-direction: column; align-items: center;">

        <!-- Logo area -->
        <div style="margin-bottom: 32px; display: flex; flex-direction: column; align-items: center; gap: 12px;">
          <img src="loginlogo.png" alt="Logo de Ruteo" style="width: 100px; height: auto; object-fit: contain; filter: drop-shadow(0 6px 14px rgba(37, 99, 235, 0.2));">
          <div style="font-size: 13px; color: #64748b; text-align: center; line-height: 1.4;">Viajar bien, empieza aqui</div>
        </div>

        <!-- Form -->
        <div style="width: 100%; display: flex; flex-direction: column; gap: 14px;">

          <!-- Email field -->
          <div style="display: flex; flex-direction: column; gap: 5px;">
            <label style="font-size: 12px; font-weight: 500; color: #334155;">Correo electrónico</label>
            <div style="display: flex; align-items: center; gap: 10px; background: white; border: 1px solid #E2E8F0; border-radius: 10px; padding: 0 14px; height: 44px;">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <rect x="1" y="3" width="14" height="10" rx="2" stroke="#94a3b8" stroke-width="1.2"/>
                <path d="M1 5L8 9.5L15 5" stroke="#94a3b8" stroke-width="1.2"/>
              </svg>
              <span style="font-size: 13px; color: #94a3b8;">correo@ejemplo.com</span>
            </div>
          </div>

          <!-- Password field -->
          <div style="display: flex; flex-direction: column; gap: 5px;">
            <label style="font-size: 12px; font-weight: 500; color: #334155;">Contraseña</label>
            <div style="display: flex; align-items: center; gap: 10px; background: white; border: 1px solid #E2E8F0; border-radius: 10px; padding: 0 14px; height: 44px;">
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <rect x="3" y="7" width="10" height="8" rx="1.5" stroke="#94a3b8" stroke-width="1.2"/>
                <path d="M5 7V5.5a3 3 0 016 0V7" stroke="#94a3b8" stroke-width="1.2" fill="none"/>
                <circle cx="8" cy="11" r="1" fill="#94a3b8"/>
              </svg>
              <span style="font-size: 13px; color: #334155; flex: 1; letter-spacing: 3px;">••••••••</span>
              <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
                <ellipse cx="8" cy="8" rx="7" ry="4" stroke="#94a3b8" stroke-width="1.2"/>
                <circle cx="8" cy="8" r="2" fill="#94a3b8"/>
              </svg>
            </div>
          </div>

          <!-- Login button -->
          <div style="background: #2563EB; border-radius: 10px; height: 46px; display: flex; align-items: center; justify-content: center; margin-top: 4px;">
            <span style="color: white; font-size: 14px; font-weight: 500;">Iniciar sesión</span>
          </div>

          <!-- Forgot password -->
          <div style="text-align: center; margin-top: -2px;">
            <span style="font-size: 12px; color: #2563EB; font-weight: 500;">¿Olvidaste tu contraseña?</span>
          </div>

          <!-- Divider -->
          <div style="display: flex; align-items: center; gap: 12px; margin: 4px 0;">
            <div style="flex: 1; height: 1px; background: #E2E8F0;"></div>
            <span style="font-size: 12px; color: #94a3b8;">o continúa con</span>
            <div style="flex: 1; height: 1px; background: #E2E8F0;"></div>
          </div>

          <!-- Google button -->
          <div style="background: white; border: 1px solid #E2E8F0; border-radius: 10px; height: 44px; display: flex; align-items: center; justify-content: center; gap: 10px;">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
              <path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 009 18z" fill="#34A853"/>
              <path d="M3.964 10.706c-.18-.54-.282-1.117-.282-1.706s.102-1.166.282-1.706V4.962H.957A8.996 8.996 0 000 9c0 1.452.348 2.827.957 4.038l3.007-2.332z" fill="#FBBC05"/>
              <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 00.957 4.962L3.964 6.294C4.672 4.169 6.656 3.58 9 3.58z" fill="#EA4335"/>
            </svg>
            <span style="font-size: 13px; font-weight: 500; color: #334155;">Iniciar sesión con Google</span>
          </div>

          <!-- Register link -->
          <div style="text-align: center; margin-top: 6px;">
            <span style="font-size: 12px; color: #64748b;">¿No tienes cuenta? </span>
            <span style="font-size: 12px; color: #2563EB; font-weight: 500;">Regístrate ahora</span>
          </div>

        </div>
      </div>

      <!-- Home indicator -->
      <div style="position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%); width: 100px; height: 4px; background: #334155; border-radius: 4px; opacity: 0.25;"></div>

    </div>
  </div>
</div>
